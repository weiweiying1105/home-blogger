name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping key APIs to keep serverless functions warm
        run: |
          for ep in api/images api/plans api/tags api/diag; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://weiyingwillsucceed.xyz/$ep")
            echo "$ep -> $code"
          done
